<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><title>NagarVani console</title>
<style>
 body{font-family:"Noto Sans","Noto Sans Devanagari",sans-serif;margin:0;background:#f4f5f7;color:#1d2327}
 header{background:#12344d;color:#fff;padding:12px 24px;display:flex;gap:24px;align-items:center}
 header b{font-size:18px} header a{color:#cfe3f3;text-decoration:none;font-size:14px}
 main{max-width:1000px;margin:20px auto;padding:0 16px}
 .card{background:#fff;border:1px solid #dde1e5;border-radius:8px;padding:16px 20px;margin-bottom:16px}
 textarea{width:100%;height:80px;font:inherit;font-size:15px;padding:8px;box-sizing:border-box}
 button{background:#12344d;color:#fff;border:0;border-radius:6px;padding:8px 18px;font-size:14px}
 .grid{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:14px}
 .grid div:nth-child(odd){color:#5f6b73}
 .pill{display:inline-block;color:#fff;border-radius:4px;padding:1px 8px;font-weight:600;font-size:13px}
 table{border-collapse:collapse;width:100%;font-size:13px} td,th{border-bottom:1px solid #e7e9ec;padding:5px 6px;text-align:left;vertical-align:top}
 th{color:#5f6b73;font-weight:600} h3{margin:4px 0 8px;font-size:15px}
 .muted{color:#5f6b73;font-size:12px}
</style></head><body>
<header><b>NagarVani</b><span style="opacity:.8">Triage console · prototype</span>
<a href="/">New complaint</a><a href="/queues">Ward queues</a></header>
<main>{% block body %}{% endblock %}</main></body></html>
